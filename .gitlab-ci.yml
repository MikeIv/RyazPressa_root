# install → verify → generate (статический SPA). Node 22, pnpm из packageManager.

image: node:22-bookworm

variables:
  PNPM_VERSION: '11.1.1'
  NUXT_PUBLIC_API_BASE: 'https://api.ryazpressa.ru'
  PNPM_STORE_PATH: .pnpm-store

default:
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir ${PNPM_STORE_PATH}
    - pnpm install --frozen-lockfile

stages:
  - test
  - build

verify:
  stage: test
  script:
    - pnpm verify

generate:
  stage: build
  needs:
    - verify
  script:
    - pnpm generate
  artifacts:
    name: static-spa-${CI_COMMIT_SHORT_SHA}
    paths:
      - .output/public/
    expire_in: 2 weeks
